alerts:
  - name: HighLatencyP95
    severity: warning
    condition: p95(response_sent.latency_ms) > 2000 ms
    duration: 5m
    type: symptom-based
    channel: slack:#k4-l3b-alerts
    owner: student-2A202602901
    runbook: docs/alerts.md#alert-1
  - name: RequestErrorsOrRetrievalFailures
    severity: critical
    condition: error_rate > 2% OR retrieval_success_rate < 90%
    duration: 5m
    type: symptom-based
    channel: slack:#k4-l3b-alerts
    owner: student-2A202602901
    runbook: docs/alerts.md#alert-2
  - name: DailyCostBudget
    severity: warning
    condition: daily_cost_usd > 2.5
    duration: 10m
    type: symptom-based
    channel: slack:#k4-l3b-alerts
    owner: student-2A202602901
    runbook: docs/alerts.md#alert-3
